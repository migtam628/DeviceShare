name: Repair alpha.2 published checksum names

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-alpha2-checksums.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize checksum entry to the GitHub release asset filename
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p checksums
          gh release download "v0.2.0-alpha.2" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "SHA256SUMS.txt" \
            --dir checksums
          if grep -Fq 'DeviceShare_0.2.0~alpha2_amd64.deb' checksums/SHA256SUMS.txt; then
            sed -i 's/DeviceShare_0.2.0~alpha2_amd64.deb/DeviceShare_0.2.0.alpha2_amd64.deb/g' checksums/SHA256SUMS.txt
            gh release upload "v0.2.0-alpha.2" checksums/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" --clobber
            echo "Published matching Debian release checksum filename."
          else
            grep -Fq 'DeviceShare_0.2.0.alpha2_amd64.deb' checksums/SHA256SUMS.txt
            echo "Checksum name already matches published asset."
          fi
