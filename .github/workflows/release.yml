name: Build GitHub Release
# A commit to release/REQUEST.txt triggers an end-to-end verified release.
# No local git tag or manual software packaging is required.

on:
  push:
    tags:
      - "v*-alpha.*"
    branches:
      - main
    paths:
      - "release/REQUEST.txt"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Prerelase tag, e.g. v0.2.0-alpha.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deviceshare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate the requested release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: version
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_RELEASE_TAG"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(tr -d '\r\n' < release/REQUEST.txt)"
          fi
          python scripts/verify_release_version.py "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Verified release request: $tag"

  test:
    needs: resolve
    name: Validate version and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/verify_release_version.py "${{ needs.resolve.outputs.tag }}"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q

  build:
    needs: test
    name: Package ${{ matrix.suffix }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: windows-latest
            suffix: windows-x64
          - os: macos-15
            suffix: macos-arm64
          - os: macos-15-intel
            suffix: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build portable binaries, runtime smoke-test and ZIP
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bash scripts/build_portable.sh "${{ matrix.suffix }}"
      - name: Create and validate native Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build_native_linux.sh
      - name: Create and validate Windows MSI and EXE installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build_native_windows.ps1
      - name: Create and validate Apple PKG and DMG installers
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build_native_macos.sh "${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.suffix }}
          path: |
            release-assets/*.zip
            release-assets/*.msi
            release-assets/*.exe
            release-assets/*.pkg
            release-assets/*.dmg
            release-assets/*.deb
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: release-assets
          merge-multiple: true
      - name: Validate release asset manifest and create SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          deb_version="${RELEASE_TAG#v}"
          deb_version="${deb_version/-alpha./.alpha}"
          for package in \
            DeviceShare-linux-x64.zip \
            DeviceShare-windows-x64.zip \
            DeviceShare-macos-arm64.zip \
            DeviceShare-macos-x64.zip \
            DeviceShare-windows-x64.msi \
            DeviceShare-Setup-windows-x64.exe \
            DeviceShare-macos-arm64.pkg \
            DeviceShare-macos-arm64.dmg \
            DeviceShare-macos-x64.pkg \
            DeviceShare-macos-x64.dmg \
            "DeviceShare_${deb_version}_amd64.deb"; do
            test -s "$package" || { echo "Missing release asset $package"; exit 1; }
          done
          sha256sum DeviceShare* > SHA256SUMS.txt
      - name: Publish verified native alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; no changes made."
            exit 0
          fi
          test -s release/RELEASE_NOTES.md || { echo "Missing release notes"; exit 1; }
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "DeviceShare ${RELEASE_TAG}" \
            --notes-file release/RELEASE_NOTES.md \
            --prerelease
