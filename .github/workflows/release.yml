name: Build GitHub Release

on:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: read

jobs:
  test:
    name: Verify source, version and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/verify_release_version.py "${{ github.ref_name }}"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q

  build:
    needs: test
    name: Package ${{ matrix.suffix }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: windows-latest
            suffix: windows-x64
          - os: macos-15
            suffix: macos-arm64
          - os: macos-15-intel
            suffix: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build, smoke-test, package
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bash scripts/build_portable.sh "${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.suffix }}
          path: release-assets/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: release-assets
          merge-multiple: true
      - name: Create SHA-256 checksums
        shell: bash
        run: cd release-assets && sha256sum *.zip > SHA256SUMS.txt
      - name: Publish verified alpha assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DeviceShare ${GITHUB_REF_NAME}" \
            --generate-notes --prerelease
