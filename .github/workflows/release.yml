name: Build GitHub Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
    tags:
      - "v*-alpha.*"

permissions:
  contents: read

env:
  # Initial source push publishes the very first prerelease; later tags are explicit.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.0-alpha.1' }}

jobs:
  test:
    name: Verify source, version and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/verify_release_version.py "${{ env.RELEASE_TAG }}"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q

  build:
    needs: test
    name: Package ${{ matrix.suffix }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: windows-latest
            suffix: windows-x64
          - os: macos-15
            suffix: macos-arm64
          - os: macos-15-intel
            suffix: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build, smoke-test, package
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bash scripts/build_portable.sh "${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.suffix }}
          path: release-assets/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: release-assets
          merge-multiple: true
      - name: Create SHA-256 checksums
        shell: bash
        run: cd release-assets && sha256sum *.zip > SHA256SUMS.txt
      - name: Publish verified alpha assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; no changes made."
            exit 0
          fi
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "DeviceShare ${RELEASE_TAG}" \
            --notes "First portable DeviceShare alpha. Includes agent and hub binaries for four platforms, explicit per-device HID input approval, and startup scripts. Not signed/notarized or approved for public multi-tenant deployment. See INSTALL_AGENT.md in each ZIP." \
            --prerelease
