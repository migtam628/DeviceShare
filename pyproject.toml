[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deviceshare"
version = "0.2.0a4"
description = "Self-hosted bridge for printers, USB discovery, and serial devices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=14,<17",
  "pyserial>=3.5,<4",
  "reportlab>=4.2,<5"
]

[project.optional-dependencies]
usb = ["pyusb>=1.2,<2"]
hid = ["hidapi>=0.14,<1"]
windows = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
deviceshare-hub = "deviceshare.hub:main"
deviceshare-agent = "deviceshare.agent:main"
deviceshare-devices = "deviceshare.discovery:main"

[tool.setuptools.packages.find]
include = ["deviceshare*"]

[tool.setuptools.package-data]
deviceshare = ["dashboard.html", "settings.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
